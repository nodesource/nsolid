syntax = "proto3";

import "common.proto";


package grpcagent;

enum V8CodeEventType {
  UNKNOWN = 0;
  BUILTIN = 1;
  CALLBACK = 2;
  EVAL = 3;
  FUNCTION = 4;
  INTERPRETED_FUNCTION = 5;
  HANDLER = 6;
  BYTECODE_HANDLER = 7;
  LAZY_COMPILE = 8;
  REGEXP = 9;
  SCRIPT = 10;
  STUB = 11;
  RELOCATION = 12;
}

// Profiler stacks event message
message ProfilerStacksEvent {
  CommonResponse common = 1;
  StackBatch body = 2;
}

// Stack batch payload
message StackBatch {
  repeated StackSample samples = 1;
  // Nominal PERF_COUNT_SW_CPU_CLOCK sampling frequency used for these samples.
  uint32 sample_frequency_hz = 2;
}

enum FrameKind {
  FRAME_KIND_UNKNOWN = 0;
  FRAME_KIND_V8_EMBEDDED = 1;
  FRAME_KIND_V8_JIT = 2;
  FRAME_KIND_NATIVE_MAPPED = 3;
}

message Frame {
  uint64 addr = 1;
  FrameKind kind = 2;
  string symbol_name = 3;
  V8CodeEventType symbol_type = 4;
  string script_name = 5;
  int32 script_line = 6;
  int32 script_column = 7;
  uint64 relative_addr = 8;
  string build_id = 9;
}

message StackSample {
  uint32 thread_id = 1;
  uint64 timestamp = 2;          // Nanoseconds since epoch
  repeated Frame frames = 3;
  optional uint64 node_thread_id = 4;
}
